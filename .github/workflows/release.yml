name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.2.0) — used only for the release name when triggered manually'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Install Pillow (icon generation)
        run: pip install --quiet Pillow

      - name: Generate AppIcon.ico
        run: python make_icon.py

      - name: Compile Windows resource (icon)
        run: windres lightburn_tray.rc lightburn_tray.o

      - name: Build lightburn_tray.exe
        run: nim c -d:ssl -d:release --app:gui lightburn_tray.nim

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lightburn_tray.exe

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15       # ARM (M-series) runner (explicit macOS 15)
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Install Pillow (icon generation)
        run: pip3 install --quiet --break-system-packages Pillow

      - name: Build and bundle
        run: bash build.sh

      - name: Rename DMG for architecture
        run: |
          VERSION=$(grep '^version' lightburn_tray_notification.nimble | head -1 | sed 's/.*"\(.*\)".*/\1/')
          mv "LightBurnMonitor-${VERSION}.dmg" LightBurnMonitor-arm64.dmg

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: LightBurnMonitor-arm64.dmg

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-15-intel # Intel (x86_64) runner label (use macos-15-intel)
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Install Pillow (icon generation)
        run: pip3 install --quiet --break-system-packages Pillow

      - name: Build and bundle
        run: bash build.sh

      - name: Rename DMG for architecture
        run: |
          VERSION=$(grep '^version' lightburn_tray_notification.nimble | head -1 | sed 's/.*"\(.*\)".*/\1/')
          mv "LightBurnMonitor-${VERSION}.dmg" LightBurnMonitor-x86_64.dmg

      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: LightBurnMonitor-x86_64.dmg

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos-arm, build-macos-intel]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag || 'manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: LightBurn Monitor ${{ steps.tag.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            windows/lightburn_tray.exe
            macos-arm64/LightBurnMonitor-arm64.dmg
            macos-x86_64/LightBurnMonitor-x86_64.dmg
