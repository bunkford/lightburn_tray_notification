name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.2.0) — used only for the release name when triggered manually'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Install Pillow (icon generation)
        run: pip install --quiet Pillow

      - name: Generate AppIcon.ico
        run: python make_icon.py

      - name: Compile Windows resource (icon)
        run: windres lightburn_tray.rc lightburn_tray.o

      - name: Build lightburn_tray.exe
        run: nim c -d:ssl -d:release --app:gui lightburn_tray.nim

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lightburn_tray.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      # Pin the deployment target so the binary runs on Monterey (12) and later,
      # regardless of which OS version the GitHub Actions runner uses.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Pillow (icon generation)
        run: pip3 install --quiet --break-system-packages Pillow

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Build and bundle
        run: bash build.sh

      - name: Zip app bundle
        run: zip -r LightBurnMonitor.app.zip LightBurnMonitor.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: LightBurnMonitor.app.zip

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag || 'manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: LightBurn Monitor ${{ steps.tag.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            windows/lightburn_tray.exe
            macos/LightBurnMonitor.app.zip
